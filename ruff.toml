# UMAY 9 — Ruff Configuration
# Conservative: focus on real bugs, not style noise

target-version = "py313"
line-length = 120

[lint]
select = [
    "F",     # Pyflakes (undefined names, unused imports)
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "B",     # flake8-bugbear (common bugs)
    "UP",    # pyupgrade
]

ignore = [
    "E501",   # line too long
    "W191",   # tabs
    "E111",   # indentation
    "E117",   # over-indented
    "E402",   # module level import not at top
    "F401",   # unused import
    "F811",   # redefined unused
    "E701",   # multiple statements on one line colon
    "E702",   # multiple statements on one line semicolon
    "W293",   # blank line with whitespace
    "E741",   # ambiguous variable name
    "B904",   # raise without from inside except
    "B005",   # strip with multi-characters
    "B007",   # unused loop control variable
    "UP042",  # replace str enum
    "UP031",  # printf string formatting
    "UP017",  # datetime timezone utc
    "UP035",  # deprecated import
    "UP045",  # non-pep604 annotation optional
    "UP041",  # timeout error alias
    "F841",   # unused variable
    "F402",   # import shadowed by loop var
    "I001",   # unsorted imports
    "W292",   # missing newline at end of file
    "W291",   # trailing whitespace
]

[lint.per-file-ignores]
"tests/*" = ["F"]
"__init__.py" = ["F401"]
"core/__init__.py" = ["F401"]
"agents/__init__.py" = ["F401"]
"scripts/*" = ["F", "E"]  # helper scripts
"backup/*" = ["F", "E"]  # old versions
"uploads/test/*" = ["F"]  # test fixtures

[format]
quote-style = "double"
indent-style = "space"
